<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cyber Vault: Neon Hack</title>
<style>
/* ===== Layout & Theme ===== */
:root{--c:min(11vw,calc((100vh - 210px)/3.05),135px);color-scheme:dark}
*{box-sizing:border-box;margin:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#05030d;color:#cff;font-family:Consolas,'Courier New',monospace;overflow:hidden;
 background-image:radial-gradient(ellipse at 50% 120%,#3a0a5a,transparent 60%),linear-gradient(#0ff1 1px,transparent 1px),linear-gradient(90deg,#0ff1 1px,transparent 1px);background-size:100% 100%,40px 40px,40px 40px}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:6px 14px;gap:8px}
h1{font-size:clamp(14px,3.2vh,28px);letter-spacing:.15em;color:#0ff;text-shadow:0 0 8px #0ff,0 0 24px #0ff;animation:fl 4s infinite}
h1 span{color:#f0f;text-shadow:0 0 8px #f0f,0 0 24px #f0f}
@keyframes fl{0%,92%,96%,100%{opacity:1}94%{opacity:.5}}
#hud{display:none;color:#fc0;text-shadow:0 0 8px #f90;font-weight:900;font-size:clamp(12px,2.6vh,20px)}
#hud.on{display:block}
/* ===== Walzen ===== */
#frame{position:relative;padding:10px;border-radius:14px;border:2px solid #0ff;box-shadow:0 0 20px #0ff8,inset 0 0 30px #0ff3;background:#0008}
#reels{display:grid;grid-template-columns:repeat(5,var(--c));gap:6px}
.reel{height:calc(var(--c)*3);overflow:hidden;border-radius:8px;background:linear-gradient(#10062a,#07031a);border:1px solid #f0f6}
.reel.tense{animation:tn .25s infinite alternate}
@keyframes tn{to{box-shadow:0 0 18px #f33,inset 0 0 18px #f33;border-color:#f33}}
.strip.blur{filter:blur(3px) brightness(1.4)}            /* Bewegungsunschärfe */
.cell{height:var(--c);width:var(--c);padding:12%;position:relative}
.cell svg{width:100%;height:100%;filter:drop-shadow(0 0 5px currentColor)}
.cell.wild{background:radial-gradient(#f0f4,transparent 70%)}
.cell.win{animation:pl .45s infinite alternate;box-shadow:inset 0 0 0 2px #0ff,inset 0 0 20px #0ff;z-index:1}
@keyframes pl{to{transform:scale(1.08);box-shadow:inset 0 0 0 3px #fff,inset 0 0 30px #0ff}}
.cell.sticky{box-shadow:inset 0 0 0 2px #f0f,inset 0 0 18px #f0f}
.cell.sticky::after{content:'🔒';position:absolute;top:2px;right:4px;font-size:calc(var(--c)*.18)}
.ft{position:absolute;left:50%;top:45%;font-size:clamp(22px,7vh,56px);font-weight:900;color:#fc0;text-shadow:0 0 12px #f90;pointer-events:none;animation:rise 1.4s forwards;z-index:5;white-space:nowrap}
@keyframes rise{from{transform:translate(-50%,0) scale(.5);opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.2)}to{transform:translate(-50%,-90px) scale(1);opacity:0}}
/* ===== Dashboard ===== */
footer{width:min(1000px,100%);display:flex;gap:clamp(6px,1.5vw,16px);align-items:center;justify-content:center;padding:8px 10px 10px;flex-wrap:wrap}
.box{background:#0008;border:1px solid #0ff6;border-radius:10px;padding:5px 10px;text-align:center;min-width:clamp(80px,14vw,140px)}
.box small{display:block;font-size:10px;color:#8ff;letter-spacing:.15em}
.box b{font-size:clamp(16px,3.4vh,26px);color:#fff;text-shadow:0 0 8px #0ff}
#winbox b{color:#fc0;text-shadow:0 0 8px #f90}
.grp{display:flex;gap:6px;align-items:center}
button{font:inherit;color:#0ff;background:#0ff1;border:1px solid #0ff;border-radius:8px;padding:8px 12px;cursor:pointer;text-shadow:0 0 6px #0ff;transition:.15s}
button:hover:not(:disabled){background:#0ff3;box-shadow:0 0 12px #0ff}
button:disabled{opacity:.4;cursor:not-allowed}
#spin{width:clamp(70px,16vh,104px);height:clamp(70px,16vh,104px);border-radius:50%;font-weight:900;letter-spacing:.1em;color:#fff;background:radial-gradient(#f0f,#80a);border:3px solid #fff;box-shadow:0 0 25px #f0f,inset 0 0 20px #fff8;animation:sp 1.6s infinite alternate;text-shadow:0 0 8px #fff}
@keyframes sp{to{box-shadow:0 0 45px #f0f,0 0 10px #fff,inset 0 0 20px #fff8}}
#reset{color:#f66;border-color:#f66}
/* ===== Overlays ===== */
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
#msg{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:20;text-align:center;background:#0006;padding:10px}
#msg.on{display:flex}
#msg h2{font-size:clamp(30px,9vh,80px);color:#fc0;text-shadow:0 0 20px #f90,0 0 50px #f0f;animation:zm .6s ease-out}
#msg p{font-size:clamp(14px,4vh,32px);color:#0ff}
@keyframes zm{from{transform:scale(.2);opacity:0}}
#fw{position:fixed;inset:0;background:radial-gradient(#102,#000 90%);display:none;align-items:center;justify-content:center;z-index:15;text-align:center;padding:10px}
#fw.on{display:flex}
#fw h2{color:#0f8;text-shadow:0 0 15px #0f8;font-size:clamp(20px,5vh,40px)}
#nodes{display:flex;gap:clamp(6px,2vw,20px);justify-content:center;margin:14px 0}
.node{width:clamp(60px,15vw,140px);height:clamp(80px,34vh,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:clamp(20px,6vh,40px);font-weight:900;color:#0ff}
.node svg{width:50%;stroke:currentColor;fill:none;stroke-width:3}
.node small{font-size:10px}
.node.good{color:#0f8;border-color:#0f8;box-shadow:0 0 20px #0f8}
.node.bad{color:#f33;border-color:#f33;box-shadow:0 0 20px #f33;animation:shk .4s}
.node.dim{opacity:.45}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#fwsum{font-size:clamp(20px,6vh,44px);color:#fc0;text-shadow:0 0 12px #f90;font-weight:900}
@media(orientation:portrait){:root{--c:17vw}}
/* ===== Hack-Meter ===== */
#meter{display:flex;align-items:center;gap:8px;width:min(720px,94vw);font-size:clamp(10px,2.2vh,14px);color:#8ff}
#mbar{flex:1;height:clamp(10px,2.2vh,16px);border:1px solid #0ff;border-radius:9px;overflow:hidden;background:#000a;box-shadow:0 0 8px #0ff6}
#mfill{display:block;height:100%;width:0;background:linear-gradient(90deg,#0ff,#0f8,#fc0,#f0f,#0ff);background-size:200% 100%;transition:width .6s;animation:mv 2s linear infinite}
@keyframes mv{to{background-position:200% 0}}
#meter.full #mbar{animation:pl2 .5s infinite alternate}
#meter.full #mp{color:#fc0;text-shadow:0 0 10px #fc0}
@keyframes pl2{to{box-shadow:0 0 22px #fc0;border-color:#fc0}}
#pips{white-space:nowrap}
/* ===== Hacker-PC ===== */
#mid{display:flex;align-items:center;gap:clamp(8px,1.6vw,18px)}
#pc{width:clamp(120px,19vw,210px);height:calc(var(--c)*3 + 26px);display:flex;flex-direction:column;border:3px solid #0f8;border-radius:12px 12px 6px 6px;background:#02120a;box-shadow:0 0 22px #0f85,inset 0 0 25px #0f83;padding:6px;font-size:clamp(8px,1.9vh,12px);color:#0f8;position:relative}
#pch{display:flex;justify-content:space-between;border-bottom:1px solid #0f85;padding-bottom:3px;margin-bottom:3px}
#pcw{flex:1;min-height:0;position:relative;overflow:hidden}
#pcs{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;line-height:1.35;white-space:nowrap}
#pcs div{animation:tp .3s steps(10) both;overflow:hidden;text-shadow:0 0 5px currentColor}
@keyframes tp{from{max-width:0}to{max-width:100%}}
#pcs div:last-child::after{content:'█';animation:bk .6s steps(1) infinite}
@keyframes bk{50%{opacity:0}}
#pcm{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:clamp(11px,2.6vh,18px);background:#000c;z-index:2}
#pc.full{border-color:#fc0;color:#fc0;animation:pf .5s infinite alternate}
@keyframes pf{to{box-shadow:0 0 45px #fc0,inset 0 0 30px #fc06}}
#pc.deny{border-color:#f33;color:#f33;animation:shk .4s 2}
#pc.deny #pcm{display:flex;text-shadow:0 0 10px #f33}
#pcf{padding-top:3px;border-top:1px solid #0f85;margin-top:3px;white-space:nowrap}
@media(orientation:portrait){#mid{flex-direction:column}#pc{width:calc(var(--c)*5 + 50px);height:90px}}
/* ===== Bonus-Cinematic ===== */
#intro{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:25;text-align:center;background:radial-gradient(circle,#000a,#000f);overflow:hidden;--k:#0f8;pointer-events:none;padding:10px}
#intro.on{display:flex;animation:fi .3s}
@keyframes fi{from{opacity:0}}
#intro::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#0003 3px 4px);animation:scl 1s linear infinite}
@keyframes scl{to{background-position:0 8px}}
.ring{position:absolute;width:20vmin;height:20vmin;border:4px solid var(--k);border-radius:50%;box-shadow:0 0 30px var(--k),inset 0 0 30px var(--k);animation:rg 1.6s ease-out infinite;opacity:0}
@keyframes rg{from{transform:scale(.3);opacity:1}to{transform:scale(6);opacity:0}}
.ico{width:clamp(90px,28vh,220px);aspect-ratio:1;color:var(--k);animation:ic 2.8s ease-out both;position:relative;filter:drop-shadow(0 0 25px var(--k))}
.ico svg{width:100%;height:100%}
@keyframes ic{0%{transform:scale(0) rotate(-270deg)}35%{transform:scale(1.3) rotate(10deg)}50%,100%{transform:scale(1) rotate(0)}}
#intro h2{position:relative;font-size:clamp(28px,10vh,90px);color:#fff;text-shadow:0 0 20px var(--k),0 0 50px var(--k);animation:gl .25s steps(2) infinite;letter-spacing:.08em}
@keyframes gl{0%{transform:translate(0)}50%{transform:translate(-3px,2px);text-shadow:4px 0 #f0f,-4px 0 #0ff}100%{transform:translate(3px,-2px)}}
#intro p{position:relative;color:var(--k);font-size:clamp(12px,3.4vh,26px);margin-top:8px;animation:zm .8s .4s both}
.shake{animation:shk2 .5s 3}
@keyframes shk2{20%{transform:translate(-6px,4px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(4px,3px)}}
/* ===== Jackpots, Modus-Badge, Terminal-Tabs ===== */
.jps{display:flex;gap:clamp(6px,1.5vw,14px);justify-content:center;font-size:clamp(9px,2.1vh,13px);font-weight:900}
.jps span{border:1px solid currentColor;border-radius:6px;padding:1px 8px;white-space:nowrap;background:#0006;text-shadow:0 0 6px currentColor;box-shadow:0 0 8px currentColor}
.j0{color:#0f8}.j1{color:#0ff}.j2{color:#f6f}.j3{color:#fc0;animation:pf2 .8s infinite alternate}
#mode{--mc:#0ff;padding:3px 12px;border:1px solid var(--mc);color:var(--mc);border-radius:20px;font-weight:900;font-size:clamp(10px,2.4vh,16px);text-shadow:0 0 8px var(--mc);box-shadow:0 0 12px var(--mc);white-space:nowrap}
#pch{gap:4px}
.tb{cursor:pointer;opacity:.55;font-size:.9em;padding:1px 3px;border-radius:4px;white-space:nowrap}
.tb[data-i="0"],.pcs[data-i="0"]{color:#0f8}.tb[data-i="1"],.pcs[data-i="1"]{color:#f6f}.tb[data-i="2"],.pcs[data-i="2"]{color:#0ff}
.tb.on{opacity:1;background:#fff1;box-shadow:0 0 8px currentColor}
.tb.full{opacity:1;animation:pf2 .5s infinite alternate}
@keyframes pf2{to{color:#fc0;text-shadow:0 0 8px #fc0}}
.pcs{position:absolute;inset:0;display:none;flex-direction:column;justify-content:flex-end;overflow:hidden;line-height:1.35;white-space:nowrap}
.pcs.on{display:flex}
.pcs div{animation:tp .3s steps(10) both;overflow:hidden;text-shadow:0 0 5px currentColor}
.pcs div:last-child::after{content:'█';animation:bk .6s steps(1) infinite}
.cell.orb{background:radial-gradient(#0ff4,transparent 70%)}
#hud{font-size:calc(clamp(12px,2.6vh,20px)*(1 + var(--lv,0)*.07));transition:font-size .4s} /* HUD wächst mit dem Overclock-Level */
/* ===== Jackpot-Plaketten ===== */
#rain{position:fixed;inset:0;display:none;pointer-events:none;z-index:12}
.jps{font-size:clamp(10px,2.4vh,15px);align-items:stretch;gap:clamp(6px,1.2vw,12px)}
.jc{--k:#0f8;position:relative;overflow:hidden;min-width:clamp(70px,13vw,150px);padding:2px 10px 3px;text-align:center;border-radius:10px;color:#fff;border:2px solid var(--k);background:linear-gradient(180deg,#2a1450,#07021a);box-shadow:0 0 14px var(--k),inset 0 0 10px #0008}
.jc small{display:block;font-size:.8em;letter-spacing:.2em;color:var(--k);text-shadow:0 0 8px var(--k)}
.jc b{display:block;font-size:1.35em;text-shadow:0 0 8px var(--k)}
.jc::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff6,transparent);transform:skewX(-20deg);animation:shn 3.5s infinite}
@keyframes shn{0%,60%{left:-60%}100%{left:130%}}
.jc.j0{--k:#0f8}.jc.j1{--k:#0ff}.jc.j2{--k:#f6f}
.jc.j3{--k:#fc0;min-width:clamp(90px,17vw,190px);transform:scale(1.08);animation:gp 1.2s infinite alternate}
@keyframes gp{to{box-shadow:0 0 28px #fc0,0 0 6px #fff,inset 0 0 18px #fc08}}
.jc.hit{animation:gp .3s infinite alternate;transform:scale(1.15);z-index:2}
@media(max-height:480px){:root{--c:min(11vw,calc((100vh - 170px)/3.05))}.jc small,.jc b{display:inline;font-size:1em}.jc small{margin-right:6px}}
/* ===== Core Link ===== */
#lk{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:16;background:radial-gradient(#023,#000 90%);--d:min(13vw,calc((100vh - 260px)/3));padding:10px}
#lk.on{display:flex}
#lkh{display:flex;gap:18px;align-items:center;font-weight:900;font-size:clamp(14px,3.4vh,26px);color:#0ff;text-shadow:0 0 10px #0ff}
#lkt{color:#fc0;text-shadow:0 0 10px #f90}
#lkg{display:grid;grid-template-columns:repeat(5,var(--d));gap:6px}
.oc{width:var(--d);height:var(--d);border-radius:50%;border:2px dashed #0ff4;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:clamp(9px,2.4vh,16px);color:#fff}
.oc.spn{animation:fk .15s infinite alternate;border-color:#0ff}
@keyframes fk{to{background:#0ff3;box-shadow:0 0 14px #0ff}}
.oc.on{border:2px solid #0ff;background:radial-gradient(circle at 35% 30%,#fff9,#0ff 30%,#046 85%);box-shadow:0 0 18px #0ff;text-shadow:0 0 4px #000}
.oc.j{background:radial-gradient(circle at 35% 30%,#fff9,#fc0 30%,#740 85%);box-shadow:0 0 22px #fc0}
.oc.pop{animation:pp .5s}
@keyframes pp{from{transform:scale(2.2);opacity:0}}
/* ===== Core Link / Hold&Spin: Slot-Walzen in den Feldern ===== */
#app{position:relative;z-index:1}
#lkg{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.bd{display:grid;grid-template-columns:repeat(5,var(--d));gap:6px}
#lk.two{--d:min(7.2vw,calc((100vh - 260px)/3))}
.two .oc{font-size:clamp(7px,1.6vh,12px)}
.oc{position:relative;overflow:hidden}
.oc b{position:relative;z-index:1}
.oc.spn{animation:none;border:2px solid #fff6;background:#0006}
.oc.st{animation:stl .3s}
@keyframes stl{from{transform:translateY(-12%)}}
.rs{position:absolute;left:0;top:0;width:100%;animation:rl .28s linear infinite;filter:blur(1.5px)}
.rs i{display:block;width:100%;height:var(--d);position:relative}
.rs i.rb::after{content:'';position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,var(--bc,#0ff) 40%,#0000 90%)}
.rs i.re::after{content:'';position:absolute;inset:44%;border-radius:50%;background:#fff3}
@keyframes rl{to{transform:translateY(calc(var(--d)*-4))}}
.oc.on.x{border:2px solid #3fd;background:radial-gradient(circle at 35% 30%,#fff9,#3fd 30%,#064 85%);box-shadow:0 0 22px #3fd;animation:xv 1.1s forwards}
@keyframes xv{70%{transform:scale(1.15)}to{transform:scale(0);opacity:0}}
.oc.mc{box-shadow:0 0 18px #f80,inset 0 0 0 3px #fc0}
.oc em{position:absolute;font-style:normal;font-weight:900;font-size:1.6em;color:#fff;text-shadow:0 0 10px #f80;background:#e22c;border-radius:8px;padding:0 6px;z-index:3;animation:pp .6s}
.oc.spl{animation:spl .55s cubic-bezier(.3,1.4,.5,1);z-index:4}
@keyframes spl{from{transform:translate(var(--dx),var(--dy)) scale(.55)}}
#wc{font-size:clamp(40px,16vh,130px);font-weight:900;color:#fff;text-shadow:0 0 20px #fc0,0 0 50px #f90;animation:wcp .3s infinite alternate}
@keyframes wcp{to{transform:scale(1.06)}}
#lkspin{width:clamp(64px,13vh,92px);height:clamp(64px,13vh,92px);border-radius:50%;font-weight:900;letter-spacing:.1em;color:#fff;background:radial-gradient(#f0f,#80a);border:3px solid #fff;box-shadow:0 0 25px #f0f;animation:sp 1.6s infinite alternate}
#lk.t2 #lkspin{background:radial-gradient(#fc0,#a40);box-shadow:0 0 25px #fc0}
/* ===== Slot 2: Dragon Pearl (Theme) ===== */
#lk.t2{--bc:#fc0;background:radial-gradient(#3a0a0a,#000 90%)}
#lk.t2 #lkh{color:#fc0;text-shadow:0 0 10px #f80}
#lk.t2 .oc.on{border-color:var(--pc,#fc0);background:radial-gradient(circle at 35% 30%,#fff9,var(--pc,#fc0) 35%,#200 95%);box-shadow:0 0 18px var(--pc,#fc0)}
#lk.t2 .oc.on.j{border-color:#f44;background:radial-gradient(circle at 35% 30%,#fff9,#e33 30%,#600 85%);box-shadow:0 0 22px #f44}
#shr{display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;width:clamp(120px,19vw,210px);height:calc(var(--c)*3 + 26px);border:3px solid #fc0;border-radius:12px;background:radial-gradient(#3a0a0a,#120303);box-shadow:0 0 22px #fc08,inset 0 0 25px #e224;color:#fc0;font-size:clamp(9px,2vh,13px);padding:6px}
#shs{width:50%;animation:spin 6s linear infinite;filter:drop-shadow(0 0 12px #f80)}
#shs svg{width:100%}
@keyframes spin{to{transform:rotate(360deg)}}
#shp{font-size:1.15em;letter-spacing:.15em;line-height:1.4;text-shadow:0 0 10px currentColor}
@media(orientation:portrait){#shr{width:calc(var(--c)*5 + 50px);height:90px}}
body.t2 #shr{display:flex}body.t2 #pc{display:none}
body.t2{background-color:#1a0505;background-image:radial-gradient(circle at 50% 110%,#a2200066,transparent 55%),radial-gradient(circle at 50% 100%,transparent 38%,#fc03 39%,transparent 42%,transparent 55%,#fc02 56%,transparent 59%);background-size:100% 100%,64px 32px}
body.t2 h1{color:#fc0;text-shadow:0 0 8px #f80,0 0 24px #e22;animation:none}
body.t2 h1 span{color:#f44;text-shadow:0 0 8px #f44,0 0 24px #e22}
body.t2 footer,body.t2 header button{filter:hue-rotate(-140deg)}
body.t2 #frame{background:linear-gradient(#1a0505,#1a0505) padding-box,linear-gradient(90deg,#fc0,#e22,#fc0,#3d9,#fc0) border-box;background-size:auto,300% 100%;box-shadow:0 0 28px #e226,0 0 50px #fc04}
body.t2 .reel{border-color:#fc08;background:linear-gradient(#3a0a0a,#120303)}
body.t2 .cell.orb{background:radial-gradient(#fc04,transparent 70%)}
body.t2 .cell.win{animation-name:plt;box-shadow:inset 0 0 0 2px #fc0,inset 0 0 20px #f80}
@keyframes plt{to{transform:scale(1.08);box-shadow:inset 0 0 0 3px #fff,inset 0 0 30px #fc0}}
#fl{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;display:none}
body.t2 #fl{display:block}
#fl i{position:absolute;top:0;opacity:.35;animation:flt 16s linear infinite}
#fl i svg{width:100%}
@keyframes flt{from{transform:translateY(110vh) rotate(-8deg)}to{transform:translateY(-20vh) rotate(8deg)}}
#pk{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:17;background:radial-gradient(#400,#000 90%);text-align:center;padding:10px;color:#fdd}
#pk.on{display:flex}
#pk h2{color:#fc0;font-size:clamp(20px,6vh,44px);text-shadow:0 0 20px #f80}
#pkc{display:flex;gap:clamp(8px,2vw,22px);flex-wrap:wrap;justify-content:center}
.pcard{--k:#fc0;width:clamp(120px,24vw,230px);padding:12px;border-radius:16px;border:2px solid var(--k);background:linear-gradient(#2a0a0a,#0a0202);color:#fff;box-shadow:0 0 20px var(--k);display:flex;flex-direction:column;align-items:center;gap:6px;animation:fl2 2.4s ease-in-out infinite alternate}
.pcard svg{width:55%;filter:drop-shadow(0 0 10px var(--k))}
